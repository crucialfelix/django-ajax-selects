; run all:
; tox
;
; run one:
; tox -e py312-dj52
;
[tox]
envlist =
  {py310,py311}-{dj52}
  {py312,py313,py314}-{dj52,dj60,dj61}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
    PYTHONPATH = {toxinidir}:{toxinidir}/ajax_select:{toxinidir}/tests
    PYTHONWARNINGS = default
allowlist_externals = django-admin
commands = django-admin test tests
deps =
  dj52: Django>=5.2,<6.0
  dj60: Django>=6.0,<6.1
  dj61: Django>=6.1,<6.2
  ; djmain: https://github.com/django/django/zipball/main
